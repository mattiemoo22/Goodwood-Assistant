<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goodwood Setup Assistant</title>
<style>
:root{--bg:#f6f5f2;--surface:#fff;--ink:#1d1d1b;--mute:#6b6a66;--line:#e4e2dc;--accent:#2d5be3;--accent-ink:#fff;--bot:#fff;--you:#2d5be3;--chip:#eaf0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--surface:#1f1f1d;--ink:#f1efe9;--mute:#9a988f;--line:#33332f;--accent:#7b9bff;--accent-ink:#0d1330;--bot:#232321;--you:#3a5fd6;--chip:#222c4d}}
:root[data-theme="dark"]{--bg:#141413;--surface:#1f1f1d;--ink:#f1efe9;--mute:#9a988f;--line:#33332f;--accent:#7b9bff;--accent-ink:#0d1330;--bot:#232321;--you:#3a5fd6;--chip:#222c4d}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:18px}
header h1{font-size:16px;margin:0;line-height:1.2}header small{color:var(--mute);font-size:12px}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{background:var(--bot);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.you{background:var(--you);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:8px 12px;border-radius:99px;text-align:left}
form{display:flex;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
input[type=text]{flex:1;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:10px 16px;outline:none;min-width:0}
button.send{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;border-radius:22px;padding:0 18px}
button:disabled{opacity:.5}
</style></head>
<body>
<header><div class="logo">🎥</div><div><h1>Goodwood Setup</h1><small>Video, stream &amp; lighting troubleshooting</small></div></header>
<main id="chat"></main>
<form id="f"><input type="text" id="q" placeholder="What’s going wrong?" autocomplete="off"><button class="send" id="go">Ask</button></form>
<script>
const $=s=>document.querySelector(s),chat=$("#chat"),q=$("#q"),go=$("#go");
let messages=[],busy=false;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function add(role,html){const d=document.createElement("div");d.className="msg "+role;d.innerHTML=html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
(function(){
  add("bot","Hi! Tell me what’s going wrong, or what you need to connect, and I’ll give you the quick answer.");
  const c=document.createElement("div");c.className="chips";
  ["The screens are flickering","Birddog isn’t working","Where’s the stage bug?","There’s no haze","The Akai isn’t controlling anything","Light bar 2 is yellow"].forEach(t=>{const b=document.createElement("button");b.className="chip";b.textContent=t;b.onclick=()=>ask(t);c.appendChild(b)});
  chat.appendChild(c);
})();
async function ask(text){
  if(busy||!text.trim())return;
  document.querySelectorAll(".chips").forEach(c=>c.remove());
  add("you",esc(text));q.value="";
  const out=add("bot","…");busy=true;go.disabled=true;
  messages.push({role:"user",content:text});
  try{
    const r=await fetch("/.netlify/functions/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});
    if(!r.ok)throw new Error("bad");
    const d=await r.json();
    out.innerHTML=fmt(d.text);
    messages.push({role:"assistant",content:d.text});
    if(d.source==="fallback")out.insertAdjacentHTML("beforeend",'<div class="hint">AI is busy right now, showing the closest match from the notes.</div>');
    else if(!/more detail|steps/i.test(text)&&!/don’t have|don\'t have/.test(d.text)){const mb=document.createElement("button");mb.className="chip";mb.style.cssText="display:block;margin-top:8px;font-size:13px;padding:5px 11px";mb.textContent="More detail";mb.onclick=()=>{mb.remove();ask("Give me more detail and the full steps on that")};out.appendChild(mb)}
  }catch(e){messages.pop();out.textContent="Sorry, I couldn’t reach the assistant. Check your connection and try again."}
  finally{busy=false;go.disabled=false;chat.scrollTop=chat.scrollHeight}
}
$("#f").onsubmit=e=>{e.preventDefault();ask(q.value)};
</script>
</body></html>
